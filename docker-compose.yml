# =============================================================================
# Invoice Download Tool - full stack
#   - backend : built from this repo (NestJS API + serves the built frontend)
#   - gotenberg : HTML -> PDF conversion used by the invoice PDF export
#
# Quick start:  docker compose up -d --build
# App         -> http://localhost:9000   (ports: 9000 -> 3000)
# Gotenberg   -> internal only, reached by the backend at http://gotenberg:3000
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      # Lắng nghe trên tất cả card mạng (Wi-Fi, LAN, VPN, localhost) tại cổng 8080
      - "0.0.0.0:${HOST_PORT:-8080}:3000"
    stop_grace_period: 30s
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      # ── Hạ tầng container: GIÁ TRỊ KHÁC với host nên đặt ở đây ──
      NODE_ENV: production
      PORT: 3000
      # SQLite DB + invoice files lưu trong volume persistent ./data
      DATABASE_URL: file:./data/dev.db
      INVOICES_DIR: ./data/invoices
      # Kết nối nội bộ tới Gotenberg service qua Docker network
      GOTENBERG_URL: http://gotenberg:3000

      # ⚠️ LƯU Ý: Các biến nghiệp vụ (JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
      # APP_URL, GEMINI_API_KEY, SEED_ON_START, ADMIN_*, SMTP_*, GOOGLE_*)
      # nên được cấu hình trong file .env ở thư mục gốc hoặc backend/.env
      # để đảm bảo bảo mật và dễ quản lý.
    volumes:
      # Lưu trữ bền vững CSDL SQLite và toàn bộ file hoá đơn
      - app_data:/app/backend/data
    networks:
      - app
    depends_on:
      gotenberg:
        condition: service_healthy
    healthcheck:
      # Kiểm tra API backend đã sẵn sàng phục vụ
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      # Kiểm tra Gotenberg đã khởi động xong engine Chromium/LibreOffice
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    name: tool_invoice_data

networks:
  app:
    name: tool_invoice_net
    driver: bridge

