# =============================================================================
# Invoice Download Tool - full stack
#   - backend : built from this repo (NestJS API + serves the built frontend)
#   - gotenberg : HTML -> PDF conversion used by the invoice PDF export
#
# Quick start:  docker compose up -d --build
# App         -> http://localhost:3000
# Gotenberg   -> internal only, reached by the backend at http://gotenberg:3000
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "9000:3000"
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      # Origin the API is served on / used for CORS
      APP_URL: http://localhost:3000
      # SQLite DB + invoice files live in ./data (persisted via the volume)
      DATABASE_URL: file:./data/dev.db
      INVOICES_DIR: ./data/invoices
      # Reach Gotenberg through the Docker network
      GOTENBERG_URL: http://gotenberg:3000
      # Security secrets (override these in production!)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-1547a23bb1794befdc8a336b0117670daba3304c672a24587aaf7453fc275a22}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-7fef1916488cf0e4575ce73fc70c8827fadb2d120208c8fb6058c700f8a84923}
      # Optional integrations
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FEEDBACK_TO_EMAIL: ${FEEDBACK_TO_EMAIL:-}
      GDT_BASE_URL: ${GDT_BASE_URL:-https://hoadondientu.gdt.gov.vn/api}
      # Google Drive Backup
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      BACKUP_AUTO_ENABLED: ${BACKUP_AUTO_ENABLED:-true}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      # Set to "false" to skip seeding on every boot
      SEED_ON_START: ${SEED_ON_START:-false}
      # Admin account created by the seed script (only when both are set)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}

    volumes:
      # Persist SQLite database + generated invoice files across restarts
      - app_data:/app/backend/data
    networks:
      - app
    depends_on:
      - gotenberg
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    # Internal only - not exposed to the host
    networks:
      - app

volumes:
  app_data:

networks:
  app:
    driver: bridge
