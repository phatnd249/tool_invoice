# =============================================================================
# Invoice Download Tool - full stack
#   - backend : built from this repo (NestJS API + serves the built frontend)
#   - gotenberg : HTML -> PDF conversion used by the invoice PDF export
#
# Quick start:  docker compose up -d --build
# App         -> http://localhost:9000   (ports: 9000 -> 3000)
# Gotenberg   -> internal only, reached by the backend at http://gotenberg:3000
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "9000:3000"
    env_file:
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      # ── Hạ tầng container: GIÁ TRỊ KHÁC với host nên phải đặt ở đây ──
      NODE_ENV: production
      PORT: 3000
      # SQLite DB + invoice files live in ./data (persisted via the volume)
      DATABASE_URL: file:./data/dev.db
      INVOICES_DIR: ./data/invoices
      # Reach Gotenberg through the Docker network
      GOTENBERG_URL: http://gotenberg:3000

      # ⚠️ CHỈ khai báo biến hạ tầng ở đây.
      # `environment` có độ ưu tiên CAO HƠN `env_file`, nên mọi biến ứng dụng
      # (JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, APP_URL, GEMINI_API_KEY, SMTP_*,
      # GOOGLE_*, BACKUP_*, GDT_BASE_URL, SEED_ON_START, ADMIN_*) KHÔNG được
      # khai báo ở đây - nếu không giá trị trong backend/.env sẽ bị GHI ĐÈ ÂM THẦM
      # và rơi về default (tức là mất cấu hình bí mật/mạng).
      # Đọc chúng từ env_file: backend/.env, hoặc .env ở root (ưu tiên hơn).
      # Mẫu cấu hình: backend/.env.example

    volumes:
      # Persist SQLite database + generated invoice files across restarts
      - app_data:/app/backend/data
    networks:
      - app
    depends_on:
      - gotenberg
    healthcheck:
      # /api phải trả 200 (AppController) - 404/500 đều coi là unhealthy
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    # Internal only - not exposed to the host
    networks:
      - app

volumes:
  app_data:

networks:
  app:
    driver: bridge
