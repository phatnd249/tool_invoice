# =============================================================================
# Nginx Configuration for Invoice Tool (Tối ưu cho Cloudflare SSL & Proxy)
# Domain: Thay đổi invoice.yourcompany.com thành domain thật của bạn
# =============================================================================

# 1. Khôi phục IP thật của người dùng từ Cloudflare (CF-Connecting-IP)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 2. Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name invoice.yourcompany.com;
    return 301 https://$host$request_uri;
}

# 3. Cấu hình HTTPS với Cloudflare Origin Certificate (Thời hạn lên tới 15 năm)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invoice.yourcompany.com;

    # Tạo từ Cloudflare: SSL/TLS -> Origin Server -> Create Certificate
    ssl_certificate /etc/ssl/cloudflare/invoice.crt;
    ssl_certificate_key /etc/ssl/cloudflare/invoice.key;

    # Bảo mật TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Giới hạn kích thước gói gửi (phù hợp Cloudflare Free 100MB)
    client_max_body_size 100M;

    # Reverse proxy tới backend NestJS
    # Cổng 9000 (nếu dùng docker-compose) hoặc cổng 3000 (nếu chạy PM2 trực tiếp)
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tắt buffer để Server-Sent Events (SSE) hiển thị tiến độ tải hoá đơn mượt mà
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
